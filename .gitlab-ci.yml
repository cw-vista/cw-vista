stages:
  - test

test:
  stage: test
  image: python:${PYTHON_VERSION}

  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

  script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python -m pip install pre-commit
    - pre-commit install
    - |
      if ! pre-commit run -a; then
        git diff
        exit 1
      fi
